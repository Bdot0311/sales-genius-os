name: Deploy edge functions

# Netlify builds the frontend on merge. Nothing deployed the edge functions,
# so anything under supabase/functions shipped only when someone remembered to
# push it by hand — and a change that never deployed is indistinguishable from
# a change that did not work. Three rounds of prompt fixes were debugged as
# prompt problems before that came to light.
#
# Only on push to main: deploying from a pull request would put unmerged code
# in front of live users.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  # Deploy everything on demand, for recovering from a missed or partial run.
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy every function regardless of what changed'
        type: boolean
        default: true

# One deploy at a time. Two merges landing together would otherwise race, and
# the loser could overwrite the newer bundle with an older one. Never cancel a
# run in flight: a half-deployed set is worse than a queued one.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is the previous tip of main, so HEAD^..HEAD is exactly what
          # the merge brought in.
          fetch-depth: 2

      - name: Require the deploy token
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at" \
              "https://supabase.com/dashboard/account/tokens and add it under" \
              "Settings → Secrets and variables → Actions. Until then the edge" \
              "functions do not deploy and merged changes will not reach users."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Work out what to deploy
        id: plan
        run: |
          set -euo pipefail
          # The project ref already lives in config.toml, which the CLI reads
          # anyway for per-function verify_jwt settings.
          REF=$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' supabase/config.toml)
          if [ -z "$REF" ]; then echo "::error::no project_id in supabase/config.toml"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "reason=manual run" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            # Shallow history or a first push — deploy everything rather than
            # guess and silently skip something.
            echo "reason=could not read the diff" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A shared module is bundled into every function that imports it, so
          # editing one leaves every importer running the old copy until it is
          # redeployed. config.toml changes verify_jwt, which is applied at
          # deploy time. Either means everything goes.
          if echo "$CHANGED" | grep -qE '^supabase/(functions/_shared/|config\.toml)'; then
            echo "reason=a shared module or config.toml changed" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # _tests holds no deployable function.
          FNS=$(echo "$CHANGED" \
            | sed -n 's#^supabase/functions/\([^/_][^/]*\)/.*#\1#p' \
            | sort -u | tr '\n' ' ')
          echo "reason=changed functions only" >> "$GITHUB_OUTPUT"
          echo "all=false" >> "$GITHUB_OUTPUT"
          echo "fns=$FNS" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF='${{ steps.plan.outputs.ref }}'
          echo "Plan: ${{ steps.plan.outputs.reason }}"

          if [ '${{ steps.plan.outputs.all }}' = 'true' ]; then
            echo "Deploying every function to $REF"
            supabase functions deploy --project-ref "$REF"
            exit 0
          fi

          FNS='${{ steps.plan.outputs.fns }}'
          if [ -z "$(echo "$FNS" | tr -d '[:space:]')" ]; then
            echo "No function directories changed; nothing to deploy."
            exit 0
          fi
          for fn in $FNS; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$REF"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Edge function deploy"
            echo ""
            echo "- Reason: ${{ steps.plan.outputs.reason }}"
            if [ '${{ steps.plan.outputs.all }}' = 'true' ]; then
              echo "- Scope: **all functions**"
            else
              echo "- Scope: \`${{ steps.plan.outputs.fns }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
