name: Generated artifact checks

# schema-refs and skills-bundle each guard a checked-in file that is derived
# from something else, where the two silently diverging is the failure mode.
# typecheck and tests are here because this is the repo's only CI workflow.
#
# Job names are the status check identities, so they are stable — renaming this
# workflow does not affect any branch protection configured against them.
#
# To make these BLOCK merges, add them as required status checks in
# Settings → Branches → branch protection for main.

on:
  pull_request:
  push:
    branches: [main]
  # Re-runnable without a commit.
  #
  # When the account crossed its Actions minute cap, every job here was
  # refused a runner -- created, then failed in three seconds with no steps
  # and no billable time. Nothing was wrong with the code, but the only ways
  # to ask for a fresh result were the Re-run button in the browser and a new
  # commit. An automated caller has neither: re-running through the API needs
  # a permission the repo's own app token does not carry, and pushing an empty
  # commit to kick CI is worse than the problem.
  #
  # One line, and a stuck run can be retried by anything that can call the
  # API, without inventing a commit to hang it on.
  workflow_dispatch:

jobs:
  # Catches the recurring class of runtime 500s where code references a Supabase
  # column that does not exist in the live schema (e.g. leads.country). Runs on
  # every PR and on pushes to main so an auto-generated edit that reintroduces
  # one fails here instead of reaching a live user.
  schema-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check DB column references against generated types
        run: node scripts/check-schema-refs.mjs
      # The other half of the same question. schema-refs catches a column that
      # does not exist; this catches a column that does exist, is NOT NULL,
      # and was left off an insert — which typechecks and fails at runtime on
      # whichever path happens to reach it first.
      - name: Check inserts supply every required column
        run: node scripts/check-insert-columns.mjs

  # The edge functions are the other half of the product, and nothing else here
  # sees them: they are Deno and are not in the app's tsconfig program, so
  # `tsc -b` compiles none of them.
  #
  # They were checked by hand with a grep for TS1xxx — syntax only — and
  # everything else was discarded as import noise. A block that read `feedback`
  # before its `const` was declared shipped that way; tsc had reported it as
  # TS2448 every time, and the grep threw it away. Deployed, it threw on every
  # draft of more than twelve leads, which is exactly the path the queue exists
  # for, and the failure read as the agent misbehaving rather than a bug with a
  # line number.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run npm ci --no-audit --no-fund
        run: npm ci --no-audit --no-fund
      - name: Check edge functions for runtime-fatal type errors
        run: node scripts/check-edge-functions.mjs

  # The gap the job above cannot see, closed.
  #
  # edge-functions runs tsc with --noResolve, because CI has no Deno there and
  # cannot fetch the https:// imports. That catches what is fatal whatever the
  # imports resolve to — a use-before-declaration deploys green and throws, and
  # one did — and misses everything that depends on a remote module's real
  # types, which is most of the code in 231 files nothing has ever checked.
  #
  # Deno can fetch them. It ran report-only first, because the size of the
  # cleanup should decide whether it blocks rather than the other way round.
  # The answer was three errors with one cause — @types/web-push declares no
  # default export and three files imported it as one — so there was nothing to
  # weigh and it blocks.
  #
  # The cost: this needs esm.sh and deno.land reachable, so an outage there
  # turns CI red on a change that is fine. edge-functions above still catches
  # the runtime-fatal classes offline when that happens, and deleting this job
  # is a one-line revert.
  edge-functions-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check the edge functions with Deno
        run: node scripts/report-deno-check.mjs

  # A typecheck that actually checks something.
  #
  # tsconfig.json has "files": [] and defers to project references, so the
  # `tsc --noEmit` everyone reaches for compiles zero files and exits 0 no
  # matter what is broken. A missing import survived it and would have shipped
  # a ReferenceError; `tsc -b` caught the same code immediately. The build does
  # not cover this either — esbuild transpiles without typechecking, so a free
  # identifier becomes a runtime crash rather than a build failure.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci, now that the lockfile is whole.
      #
      # It refused before because package.json declared @lovable.dev/email-js
      # and the lockfile carried no entry for it:
      #   npm error Missing: @lovable.dev/email-js@0.1.0 from lock file
      # That was the whole failure. A previous revision of this comment blamed
      # the private registry the lockfile pins for 294 of its 1216 packages,
      # on the strength of 403s seen while developing — but those came from a
      # sandbox egress proxy that blocks europe-west1-npm.pkg.dev, not from
      # the registry, and a GitHub runner reaches it fine.
      #
      # ci rather than install on purpose: it installs exactly what the
      # lockfile pins and fails loudly if the two drift apart again, which is
      # the failure that made this job necessary in the first place.
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (project references, not the no-op --noEmit)
        run: npx tsc -b --pretty false

  # The tests existed for months and nothing ran them.
  #
  # 93 test files, and no `test` script in package.json — so the only way to
  # execute them was to know the incantation, and CI never did. Tests that
  # never run are documentation with a misleading file extension: they pass by
  # default, they rot silently, and a regression they were written to catch
  # lands anyway.
  #
  # This job is what makes them mean something. It is separate from typecheck
  # rather than another step in it, for two reasons: a job stops at its first
  # failing step, so a type error would hide every test result behind it; and a
  # job name is a status check identity, so `typecheck` should not quietly
  # start reporting on tests as well.
  #
  # The duplicated npm ci is the price, about half a minute. Worth it for a
  # signal that says which of the two actually broke.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 everywhere.
          #
          # This job needed it first: some suites import a module that reaches
          # @/integrations/supabase/client, which calls createClient() at module
          # scope, and realtime-js then wants a native WebSocket that Node 20
          # does not have. The file failed to collect and its tests never ran —
          # silently, because a suite that never loads reports no failures of
          # its own.
          #
          # The rest followed because the runner deprecated Node 20: it forces
          # actions/checkout and setup-node onto Node 24 regardless and warns on
          # every run, so pinning 20 bought nothing and was heading for a break.
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test

  # generate-email injects the GTM skills into its prompt by importing
  # _shared/skills.generated.ts, which is compiled from .claude/skills. Editing
  # a skill without rebuilding leaves the deployed prompt on the old text — the
  # exact drift the generation step exists to prevent — and nothing at runtime
  # would reveal it.
  skills-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the skills bundle matches .claude/skills
        run: node scripts/build-skills.mjs --check
