name: Generated artifact checks

# Both jobs here guard a checked-in file that is derived from something else,
# where the two silently diverging is the failure mode.
#
# Job names are the status check identities, so they are stable — renaming this
# workflow does not affect any branch protection configured against them.
#
# To make these BLOCK merges, add them as required status checks in
# Settings → Branches → branch protection for main.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Catches the recurring class of runtime 500s where code references a Supabase
  # column that does not exist in the live schema (e.g. leads.country). Runs on
  # every PR and on pushes to main so an auto-generated edit that reintroduces
  # one fails here instead of reaching a live user.
  schema-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check DB column references against generated types
        run: node scripts/check-schema-refs.mjs

  # A typecheck that actually checks something.
  #
  # tsconfig.json has "files": [] and defers to project references, so the
  # `tsc --noEmit` everyone reaches for compiles zero files and exits 0 no
  # matter what is broken. A missing import survived it and would have shipped
  # a ReferenceError; `tsc -b` caught the same code immediately. The build does
  # not cover this either — esbuild transpiles without typechecking, so a free
  # identifier becomes a runtime crash rather than a build failure.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install, not npm ci, and deliberately.
      #
      # The committed lockfile is missing @lovable.dev/email-js, which
      # package.json declares, so `npm ci` refuses outright:
      #   npm error Missing: @lovable.dev/email-js@0.1.0 from lock file
      # That is a pre-existing drift in the repo, not something this job
      # introduced — it is simply the first CI job that installs anything. The
      # package is a Deno `npm:` import used only by edge functions, which Deno
      # resolves at deploy time, and tsconfig.app.json includes only `src`, so
      # the typecheck never needs it either way. npm install tolerates the
      # drift and resolves both missing entries.
      #
      # Regenerating the lockfile would fix `npm ci` for everyone, but it
      # rewrites ~680 packages across the tree, which is a dependency decision
      # for a human rather than a side effect of adding a typecheck.
      - run: npm install --no-audit --no-fund
      - name: Typecheck (project references, not the no-op --noEmit)
        run: npx tsc -b --pretty false

  # generate-email injects the GTM skills into its prompt by importing
  # _shared/skills.generated.ts, which is compiled from .claude/skills. Editing
  # a skill without rebuilding leaves the deployed prompt on the old text — the
  # exact drift the generation step exists to prevent — and nothing at runtime
  # would reveal it.
  skills-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the skills bundle matches .claude/skills
        run: node scripts/build-skills.mjs --check
