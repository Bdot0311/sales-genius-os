# SPA fallback — keep last.
# The /guides/* paths were retired in favour of /blog/*. They were handled by a
# client-side <Navigate>, which returns 200 with the SPA shell — search engines
# see a page, not a redirect, so all three sat in Search Console as discovered
# and never indexed. A 301 consolidates them onto the blog URLs and passes the
# signal along. They must precede the SPA fallback below.
[[redirects]]
  from = "/guides"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/guides/email-warmup"
  to = "/blog/email-warmup"
  status = 301
  force = true

[[redirects]]
  from = "/guides/b2b-icp-criteria-template"
  to = "/blog/b2b-icp-criteria-template"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response. Declared here (not only in public/_headers)
# so they are guaranteed to be served: netlify.toml is always processed, whereas a
# _headers file can be missed depending on the deploy. CSP is intentionally left to
# public/_headers so it can be verified on a deploy preview before being promoted
# here — an over-tight CSP silently breaks analytics/payments.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Agent discovery (RFC 8288). Declared in this same "/*" block rather than a
    # second one: two [[headers]] rules with an identical `for` is ambiguous —
    # whether both merge or one wins is not something to leave to chance for a
    # header that is invisible until an agent looks for it. Values here also
    # override public/_headers for the same path, so this list has to stay a
    # superset of the Link lines there or entries are silently lost (that is how
    # the openapi.json service-desc link went missing).
    Link = '''</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </openapi.json>; rel="service-desc"; type="application/openapi+json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource"; type="application/json", </api-docs>; rel="service-doc"; type="text/html", </llms.txt>; rel="describedby"; type="text/plain", </auth.md>; rel="author"; type="text/markdown"'''

# Efficient cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Extensionless agent discovery documents need explicit media types
[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/ory-verify.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
