[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- MCP reverse proxy: expose the Supabase Edge Function under the OutReign brand ---
# Requires a Netlify site (e.g. mcp.outreign.io) that serves this repo.
# Redirect order matters: these MUST come before the SPA fallback below.
[[redirects]]
  from = "/mcp"
  to = "https://ghgfjnepvxvxrncmskys.supabase.co/functions/v1/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "https://ghgfjnepvxvxrncmskys.supabase.co/functions/v1/mcp/:splat"
  status = 200
  force = true

# MCP clients probe the resource server for OAuth protected-resource metadata.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://ghgfjnepvxvxrncmskys.supabase.co/functions/v1/mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://ghgfjnepvxvxrncmskys.supabase.co/functions/v1/mcp/.well-known/oauth-protected-resource/:splat"
  status = 200
  force = true

# SPA fallback — keep last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Efficient cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Agent discovery — RFC 8288 Link headers on every HTML response
[[headers]]
  for = "/*"
  [headers.values]
    Link = '''</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource"; type="application/json", </api-docs>; rel="service-doc"; type="text/html", </llms.txt>; rel="describedby"; type="text/plain", </auth.md>; rel="author"; type="text/markdown"'''

# Extensionless agent discovery documents need explicit media types
[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
